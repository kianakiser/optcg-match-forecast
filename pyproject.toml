[project]
name = "optcg-match-forecast"
version = "0.1.0"
description = "MLOps HS26 semester project"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.32"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optcg_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# Deliberately not --strict. The value here is catching the errors that cost an afternoon
# (a None reaching a float, a wrong argument type) without turning every dataclass into a
# typing exercise.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# These ship no py.typed marker. Scoped to the modules that actually lack stubs, so a real
# missing import elsewhere still fails.
module = ["pyarrow.*", "sklearn.*"]
ignore_missing_imports = true
