# Scheduled training pipeline — MS3.
#
# Separate from the feature pipeline on purpose. They run on different clocks for different
# reasons: features must be ingested daily because a finished tournament is only available after
# it ends, while retraining weekly is enough because the metagame does not move faster than that
# and a model retrained on four new events is a model retrained on noise.
#
# Decoupling them is the F-T-I architecture doing its job. This job never calls the API and never
# computes a feature; it reads the store, and everything it needs is already there.

name: Training pipeline

on:
  schedule:
    # Mondays 07:23 UTC — AFTER the 06:07 daily ingest, not before it. At 05:41 this job ran
    # twenty-six minutes ahead of Monday's feature run and therefore always trained on Sunday's
    # corpus, silently one day stale. The gap is deliberately wide because GitHub's cron is
    # best-effort and the ingest can be delayed; if it is delayed past this, the run trains on
    # the previous day's landing zone, which is correct-but-stale rather than wrong.
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      promote:
        description: "Move the champion alias if the candidate wins (uncheck for a rehearsal)."
        required: false
        default: true
        type: boolean
      max_windows:
        description: "Rolling-origin windows to evaluate over."
        required: false
        default: "6"
        type: string

concurrency:
  group: training-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The landing zone is the durable artefact: immutable event payloads, a few tens of MB.
      # The feature store is derived from it and is rebuilt here, so only one thing needs
      # persisting. This is an interim measure — see notes/deployment_decision.md — and moves to
      # a GCS bucket once the cloud account exists, which is a change of root path and nothing
      # else.
      - name: Restore the landing zone
        uses: actions/cache/restore@v6.1.0
        with:
          path: data/landing
          key: landing-${{ github.run_id }}
          restore-keys: landing-

      # Fails loudly on an empty landing zone rather than training on nothing. If this is the
      # first run, dispatch the feature pipeline with a backfill value first.
      - name: Rebuild the feature store
        run: uv run python -m optcg_forecast.features.materialise

      # Models are restored so the run can compare against the incumbent champion, and saved so
      # the next run can. A first run with no cache simply has no champion to beat, which the
      # pipeline handles.
      - name: Restore the model registry
        uses: actions/cache/restore@v6.1.0
        with:
          path: data/models
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Train, evaluate and decide
        env:
          # A scheduled run has NO inputs context at all — the docs are explicit that its
          # properties are "only available in a reusable workflow or in a workflow triggered by
          # the workflow_dispatch event" — so `inputs.promote` is null on cron. And in Actions
          # expressions `null == false` is TRUE, because loose equality coerces both sides to 0.
          #
          # The previous form here was `${{ inputs.promote == false && '--no-promote' || '' }}`,
          # which therefore fired on EVERY weekly retrain: the job trained, evaluated, registered
          # a version and then never moved the alias. Green every Monday, champion frozen for
          # ever. Gate on the event name instead, so cron promotes and only a manual rehearsal
          # opts out.
          #
          # Values are passed through env rather than interpolated into the shell directly.
          # `${{ }}` substitutes before bash sees the line, so a free-text input becomes script.
          PROMOTE: ${{ github.event_name != 'workflow_dispatch' || inputs.promote }}
          MAX_WINDOWS: ${{ inputs.max_windows || 6 }}
        run: |
          args=(--max-windows "$MAX_WINDOWS")
          [ "$PROMOTE" = "true" ] || args+=(--no-promote)
          uv run python -m optcg_forecast.training.run "${args[@]}"

      # The promotion decision was invisible, which is how the bug above could have run for
      # months unnoticed: the job exits 0 whether it promoted, was rejected by the gate, or kept
      # the incumbent. Say which, where a human will see it.
      - name: Report the decision
        if: always()
        run: |
          {
            echo "### Training run"
            uv run python -c "
          from optcg_forecast.training.registry import CHAMPION, ModelRegistry
          reg = ModelRegistry()
          card = reg.card(CHAMPION)
          print(f'| versions | {\", \".join(reg.versions()) or \"none\"} |')
          print('|---|---|')
          if card is None:
              print('| champion | **none** — nothing has been promoted |')
          else:
              print(f'| champion | {card.version}, trained through {card.trained_through} |')
              for k, v in sorted(card.metrics.items()):
                  print(f'| {k} | {v:.4f} |')
          " || echo "could not read the registry"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the model registry
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: data/models
          key: models-${{ github.run_id }}

      # The report is the deliverable a human reads. Kept for 90 days so a run's decision can be
      # audited later: which model, on what metrics, against which incumbent.
      - name: Upload the model cards
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: model-registry-${{ github.run_id }}
          path: |
            data/models/**/card.json
            data/models/aliases.json
          if-no-files-found: warn
          retention-days: 90
