# Scheduled feature pipeline — the MS2 deliverable requires scheduled, NOT manual, execution.
#
# Two things to know before relying on this:
#  1. GitHub's cron is best-effort. Runs are delayed or SKIPPED under load, especially
#     on the hour. Never assume "one run per interval" — the course's own peer-review
#     example is literally a project whose lag features broke because cron skipped runs.
#     Make the pipeline idempotent and time-based, never row-position-based.
#     Here that is cheap: events are immutable once finished and are fetched by id, so a
#     skipped run is repaired by the next one with no gap and no special-casing.
#  2. Scheduled workflows are disabled automatically after 60 days of repository
#     inactivity. Over a semester break that will silently stop your ingestion.

name: Feature pipeline

on:
  schedule:
    # DAILY, not hourly. The source publishes roughly 0.5 events per day (193 events over the
    # 14-month backfill) and a finished event is immutable, so hourly polling would issue ~24x
    # the requests for the same rows against a keyless community API with a documented budget of
    # 50 requests / 5 minutes. 06:07 UTC sits after the evening events have closed; the :07 is to
    # stay off the top of the hour, where GitHub is most likely to skip a scheduled run.
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Any value here widens the index scan to backfill history."
        required: false
        type: string
      min_players:
        description: "Minimum event size to ingest (default 32; lowering it reduces single-organiser concentration)."
        required: false
        default: "32"
        type: string

concurrency:
  group: feature-pipeline          # never let two ingests race on the feature store
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Generous because a cold backfill is rate-limit bound, not CPU bound: two years of events
    # at 50 requests per 5 minutes is over an hour of mostly waiting. A daily run finishes in
    # about a minute and never approaches this.
    #
    # A backfill that runs out of time is not a problem to solve. Ingest skips what the landing
    # zone already holds and the cache is saved even when the job is cancelled, so the next
    # dispatch resumes exactly where this one stopped. Idempotency turns a timeout into a pause.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Without this the job ingests happily into the runner's disk and throws it away when the
      # job ends, so every run starts from nothing and re-fetches fourteen months of events —
      # which the API's rate limit will not allow. The landing zone is the one thing that has to
      # survive; the feature store is rebuilt from it every run. Interim until the GCS bucket
      # exists (see notes/deployment_decision.md): a cache entry is immutable, so each run
      # restores the newest by prefix and saves a new one under the run id.
      - name: Restore the landing zone
        uses: actions/cache/restore@v6.1.0
        with:
          path: data/landing
          key: landing-${{ github.run_id }}
          restore-keys: landing-

      - name: Run feature pipeline
        # No secrets here on purpose: the tournament endpoints this stage uses are keyless,
        # so a scheduled run needs no credentials at all. Requiring one would make the job
        # fail for no reason. HOPSWORKS_* arrive when the feature-store write lands (MS2).
        env:
          # Through env, not interpolated into the shell. `${{ }}` substitutes before bash sees
          # the line, so a free-text input would otherwise be able to inject script. These two
          # are safe on a schedule — `||` uses truthiness and null is falsy, unlike `==` which
          # coerces null to 0 and made the training workflow's promote flag misfire — but the
          # injection risk is independent of that and worth closing here too.
          BACKFILL_START: ${{ inputs.backfill_start }}
          MIN_PLAYERS: ${{ inputs.min_players || 32 }}
        run: |
          if [ -n "$BACKFILL_START" ]; then
            uv run python -m optcg_forecast.features.run \
              --limit 400 --pages 5 --min-players "$MIN_PLAYERS"
          else
            uv run python -m optcg_forecast.features.run --min-players "$MIN_PLAYERS"
          fi

      - name: Save the landing zone
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: data/landing
          key: landing-${{ github.run_id }}

      - name: Report what the store holds
        if: always()
        run: |
          echo "### Feature store" >> "$GITHUB_STEP_SUMMARY"
          uv run python -c "
          from optcg_forecast.features.store import FeatureStore
          m = FeatureStore().manifest()
          print('| metric | value |'); print('|---|---|')
          for k, v in sorted(m.items()): print(f'| {k} | {v} |')
          " >> "$GITHUB_STEP_SUMMARY"
